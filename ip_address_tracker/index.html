<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | IP Address Tracker</title>

</head>

<body>
  <header id="headerDiv"
    class="flex flex-row bg-[url('./ui/images/pattern-bg-desktop.png')] bg-cover bg-center w-full h-80 md:h-64 justify-center items-top">
    <div class="flex flex-col items-center">
      <div class="m-10">
        <h1 id="mainTitle" class="text-2xl md:text-3xl font-bold text-white"> IP Address Tracker </h1>
      </div>
      <div class="flex flex-row">
        <form class="flex flex-row" action="" validate>
          <div class="flex flex-row gap-0"> <!-- search component built with tailwind -->
            <input class="rounded-s-2xl w-2xs h-[4rem] md:w-sm md:h-[3rem] bg-white pl-4 pr-4" type="search"
              id="searchIpAddress" name="searchIpAddress" placeholder="Search for any IP address or domain" required>
            <button
              class="bg-black bg-[url('./ui/images/icon-arrow.svg')] bg-center bg-no-repeat text-transparent w-12 h-full rounded-e-2xl"
              type="submit"> submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </header>
  <main>
    <section> <!-- section containing both the ip info and map-->
      <section>
        <div>
          IP Address
          Location
          Timezone
          UTC <!-- add offset value dynamically using the API -->
          ISP
        </div>
      </section>
      <div>
        <!-- map show-->
      </div>
    </section>

  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Rajdeep Hundal.</a>.
  </footer>
</body>

</html>
