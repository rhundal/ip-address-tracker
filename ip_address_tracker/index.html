<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css" />

  <script type="importmap">
{
  "imports": {
    "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
  }
}
</script>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="./dist/index.js" defer></script>
  <title>Frontend Mentor | IP Address Tracker</title>

</head>

<body>
  <header id="headerDiv"
    class="flex flex-row bg-[url('./ui/images/pattern-bg-desktop.png')] bg-cover bg-center w-full h-80 md:h-64 justify-center items-top">
    <div class="flex flex-col items-center">
      <div class="m-10">
        <h1 id="mainTitle" class="text-2xl md:text-3xl font-bold text-white"> IP Address Tracker </h1>
      </div>
      <div class="flex flex-row">
        <form class="flex flex-row" action="" validate>
          <div class="flex flex-row gap-0"> <!-- search component built with tailwind -->
            <input class="rounded-s-2xl w-2xs h-[4rem] md:w-sm md:h-[3rem] bg-white pl-4 pr-4" type="search"
              id="searchIpAddress" name="searchIpAddress" placeholder="Search for any IP address or domain">
            <button id="submitBtn"
              class="bg-black bg-[url('./ui/images/icon-arrow.svg')] bg-center bg-no-repeat text-transparent w-12 h-full rounded-e-2xl"
              type="submit"> submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </header>
  <main class="bg-transparent -mt-[20%] md:-mt-[3%] relative">
    <section> <!-- section containing both the ip info and map-->
      <section class="relative flex justify-center z-20">
        <div
          class="grid grid-rows-4 md:grid-cols-4 gap-0 bg-white min-w-xs md:w-full md:max-w-4xl md:h-40 rounded-2xl p-5 border-2 border-gray-200 text-center md:text-left">
          <div class="flex flex-col p-5">
            <div class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200"> IP Address
            </div>
            <div id="displayIP" class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200">
            </div>
          </div>
          <div class="flex flex-col p-5">
            <div class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200"> Location</div>
            <div id="displayLocation"
              class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200"></div>
          </div>
          <div class="flex flex-col p-5">
            <div class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200"> Timezone UTC
            </div>
            <div id="displayTimezone"
              class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-2 md:border-gray-200"></div>
          </div>
          <div class="flex flex-col p-5">
            <div class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-0 md:border-gray-200"> ISP</div>
            <div id="displayIsp" class="ml-2 md:border-b-0 border-t-0 md:border-t-0 md:border-e-0 md:border-gray-200">
            </div>
          </div>
          <!-- add offset value dynamically using the API -->
        </div>
      </section>
      <div id="mapArea" class="w-full h-220 -mt-[42%] md:-mt-[8%] relative z-10">

      </div>
    </section>

  </main>

  <footer class="mt-5 mb-10 w-full grid grid-rows-2 justify-center">
    <div class="text-center"> Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    </div>
    <div class="text-center"> Coded by Rajdeep Hundal.</div>
  </footer>
</body>

</html>
